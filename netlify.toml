# Productiebuild: design/ + i18n/ -> dist/. Staging blijft noindex via _headers (build/site.py).
# Bij go-live: zet SITE_ENV op "production" in de Netlify-omgeving; die haalt de noindex weg.
[build]
  publish = "dist"
  command = "python3 build/site.py"

[build.environment]
  SITE_ENV = "staging"
  PYTHON_VERSION = "3.11"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
