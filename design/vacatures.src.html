<script src="site.js"></script>
<script>
(() => {
  const f = document.querySelector('form[data-apply]'); if (!f) return;
  const $ = id => document.getElementById(id);
  const ok = { 'a-name': v => v.trim().length > 1, 'a-mail': v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) };
  const cvOk = () => { const x = $('a-cv').files[0]; return !!x && x.size <= 4 * 1024 * 1024 && /\.(pdf|docx?)$/i.test(x.name); };
  f.addEventListener('submit', async e => {
    e.preventDefault(); let first = null;
    Object.entries(ok).forEach(([id, t]) => { const el = $(id), bad = !t(el.value); el.setAttribute('aria-invalid', bad); $(id + '-e').hidden = !bad; if (bad && !first) first = el; });
    const cv = cvOk(); $('a-cv').setAttribute('aria-invalid', !cv); $('a-cv-e').hidden = cv; if (!cv && !first) first = $('a-cv');
    const c = $('a-ok'); $('a-ok-e').hidden = c.checked; if (!c.checked && !first) first = c;
    if (first) { first.focus(); return; }
    if (!await window.RRRLead.send('sollicitatie', f, { email: 'a-mail', name: 'a-name', phone: 'a-tel', message: 'a-msg', consent: 'a-ok' }, { Vacature: f.dataset.job })) return;
    window.dataLayer?.push({ event: 'lead_sollicitatie', job: f.dataset.jobId });
    f.innerHTML = `<div role="status" tabindex="-1"><h3>${f.dataset.thanks}</h3><p style="margin-top:8px">${f.dataset.thanksP}</p></div>`;
    f.firstElementChild.focus();
  });
})();
</script>
